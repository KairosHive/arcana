[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools.packages.find]
include = ["arcana*"]

# Without this the built wheel contains ONLY .py files: db.py would lose
# assets/labels_*.txt, which DEFAULT_LABELS points at for cluster naming, and
# the page (arcana/web, built from frontend/ with `npm run build`) would not
# ship at all.
[tool.setuptools.package-data]
arcana = ["assets/*", "web/*", "web/**/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "arcana.__version__"}

[tool.black]
line-length = 128

[project]
name = "arcana"
description = "Latent space navigation for large-scale image databases using AI."
authors = [{name = "Kairos Hive"}]
# version is single-sourced from arcana/__init__.py; see [tool.setuptools.dynamic].
dynamic = ["version", "dependencies"]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["latent space", "CLIP", "image retrieval", "generative", "svelte", "exploration"]
# arcana.py and db.py use PEP 604 ("X | None") and PEP 585 ("dict[int, str]")
# annotations at runtime without `from __future__ import annotations`, so they
# raise TypeError on import below 3.10. The previous ">=3.8" was never true.
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# NVIDIA-only; the app runs without it and falls back automatically.
gpu = ["xformers>=0.0.27"]
dev = ["pytest>=7.0"]
# The MCP SDK is a main dependency now (requirements.txt), since the installer
# ships the agent's server. The extra stays so `uv run --extra agent` in older
# configurations keeps working.
agent = ["mcp>=1.10"]

[project.scripts]
# One command, `arcana`, whose subcommands are the ops (arcana op list). The
# older names stay for one release as spellings of an op line (aliases.py);
# arcana-mcp stays for good, since MCP clients start it by name.
arcana = "arcana.cli:main"
arcana-build-latent = "arcana.aliases:build_latent"
arcana-extend = "arcana.aliases:extend"
arcana-finish = "arcana.aliases:finish"
arcana-marks = "arcana.aliases:marks"
arcana-migrate = "arcana.aliases:migrate"
arcana-relocate = "arcana.aliases:relocate"
arcana-mcp = "arcana.mcp_server:main"
arcana-lut = "arcana.aliases:lut"

# --------------------------------------------------------------------------------------
# uv configuration
# --------------------------------------------------------------------------------------
# torch, torchvision and torchaudio are pulled from PyTorch's own index so a CUDA
# build is installed on machines that have an NVIDIA GPU. `explicit = true` means
# only the packages mapped below use it; everything else still comes from PyPI.
#
# For a CPU-only install (what a packaged app should ship), point these at
# https://download.pytorch.org/whl/cpu instead, or drop the [tool.uv.sources]
# block entirely and let PyPI serve the default CPU wheels.
# Keep `uv run` / `uv sync` from resolving past the versions this was tested
# against. Without these, uv.lock drifted to torch 2.11 and to a transformers
# nobody had run. transformers 5 is the tested major now (see requirements.txt).
[tool.uv]
constraint-dependencies = [
    "transformers==5.20.2",
    "pandas<3",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
